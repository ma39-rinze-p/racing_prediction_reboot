# 開催日に常駐し, 各レースの「発走 12 分前」に推論を始めて, その時点のオッズで各券種のおすすめの買い方 (期待値プラス) と回収率が最大の買い方, リスクを分散した組み合わせを通知する.
#
# - 起動のしかた:
#     - 毎朝 race-day-planner が時刻表を取得し, 対象レースがある日はこのワークフローを有効にして起動する (workflow_dispatch)
#     - 1 回の実行の中で, 次のレースの「発走 12 分前」(Variables の NOTIFY_MINUTES_BEFORE で変更可) まで待つ
#       → 推論 (出馬表・馬体重・戦績を取得して予測. 1〜2 分) → その時点のオッズで期待値を計算 → メール, を繰り返す
#       (GitHub Actions の定期実行 (schedule) は混雑時に数十分起動しないことがあるため, 時刻合わせを定期実行に頼らない)
#     - GitHub Actions のジョブは最長 6 時間なので, 5 時間 30 分を過ぎてから始まる通知が残っていれば,
#       次の実行を自分で起動してから終了する (concurrency により, 前の実行が終わってから次の実行が始まる)
#     - 万一常駐している実行が止まった場合に備え, 30 分おきの定期実行でも起動する
#       (常駐中は concurrency により待機し, 前の実行が終わった後に通知が残っていなければすぐ終わる)
#   土日だけでなく, 祝日開催・代替開催 (例: 2026-02-10 火曜) にも対応するため曜日では絞らない.
# - その日に送る通知が残っていなくなったら (最終レース後など), このワークフローが自分を無効にする.
#   翌日以降は race-day-planner が必要な日に有効に戻す.
# - 起動時は, 状態ファイル (時刻表・送った通知) だけで「今日送る通知が残っているか」を判定し,
#   なければ重いライブラリのインストール前に終了する.
# - 待機している時間も GitHub Actions の実行時間に数えられる (公開リポジトリは無料. 非公開リポジトリは無料枠を超える).
# - 無効になっているときに手動実行 (Run workflow) したい場合は, Actions 画面で先に「Enable workflow」を押す.
# - 予測に使うモデルは models/production/ (model.txt, metadata.json) をリポジトリに置く.
# - 通知先は Secrets に設定する (SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, MAIL_TO, NTFY_TOPIC).
# - 定期実行 (schedule) はデフォルトブランチ (main) にあるこのファイルだけが動く.
name: race-inference

on:
  schedule:
    # 常駐している実行が止まった場合の予備. UTC 0:07〜7:37 = 日本時間 9:07〜16:37, 30 分おき
    - cron: "7,37 0-7 * * *"
  workflow_dispatch:
    inputs:
      race_id:
        description: "時刻に関係なく, 今のオッズで予測・通知するレース ID (空なら通常どおり常駐する)"
        required: false
        default: ""
      dry_run:
        description: "通知せずにログに表示するだけ"
        type: boolean
        default: false

# 同時に動かさない (通知の重複を防ぐ). 後から起動した実行は, 前の実行が終わるまで待つ
concurrency:
  group: race-inference
  cancel-in-progress: false

permissions:
  actions: write   # 自分自身の起動・無効化, キャッシュの保存
  contents: read

env:
  # 対象の競馬場・レース番号 (Settings > Secrets and variables > Actions > Variables で変更できる)
  VENUES: ${{ vars.INFERENCE_VENUES }}
  RACE_NUMBERS: ${{ vars.INFERENCE_RACE_NUMBERS || '7-12' }}
  # 推論を始めて通知するタイミング (発走何分前. カンマ区切り)
  NOTIFY_MINUTES_BEFORE: ${{ vars.NOTIFY_MINUTES_BEFORE || '12' }}

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub Actions の上限 (360 分) の手前. 常駐は 330 分で区切って次の実行に引き継ぐ
    steps:
      - uses: actions/checkout@v7

      # その日の時刻表と通知済みレースを前回の実行から引き継ぐ
      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: .inference_state
          key: inference-state-${{ github.run_id }}
          restore-keys: inference-state-

      # 標準ライブラリだけで判定 (ネットアクセスなし). 手動でレース ID を指定したときは必ず実行する
      - name: Check whether to run
        id: precheck
        env:
          RACE_ID: ${{ inputs.race_id }}
        run: |
          if [ -n "$RACE_ID" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "レース ID が指定されたため実行します: $RACE_ID"
          else
            python3 src/racing_prediction/inference/precheck.py --venues "$VENUES" --race-numbers "$RACE_NUMBERS" \
              --odds-minutes-before "$NOTIFY_MINUTES_BEFORE"
          fi

      - uses: actions/setup-python@v7
        if: steps.precheck.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-inference.txt

      - name: Install dependencies
        if: steps.precheck.outputs.run == 'true'
        run: pip install -r requirements-inference.txt

      - name: Predict and notify
        id: run
        if: steps.precheck.outputs.run == 'true'
        env:
          PYTHONPATH: src
          PYTHONUNBUFFERED: "1"   # 待機中もログをすぐ表示する
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RACE_ID: ${{ inputs.race_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--venues "$VENUES" --race-numbers "$RACE_NUMBERS" --odds-minutes-before "$NOTIFY_MINUTES_BEFORE"
                --max-runtime-minutes 330)
          if [ -n "$RACE_ID" ]; then args+=(--race-id "$RACE_ID"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python -m racing_prediction.inference.run "${args[@]}"

      - name: Save state
        if: always() && steps.precheck.outputs.run == 'true' && hashFiles('.inference_state/**') != ''
        uses: actions/cache/save@v6
        with:
          path: .inference_state
          key: inference-state-${{ github.run_id }}

      # 実行時間の上限が近くて終了した場合は, 次の実行を起動して続きを任せる
      # (GITHUB_TOKEN による workflow_dispatch は新しい実行を起動できる. この実行が終わってから始まる)
      - name: Start the next run
        if: always() && steps.run.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run race-inference.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          echo "続きを処理する次の実行を起動しました"

      # 今日これから送る通知が残っていなければ (非開催日・最終レース後など),
      # このワークフローを無効にして以降の起動を止める. 翌日以降は race-day-planner が必要な日に有効に戻す.
      - name: Check remaining races
        id: remaining
        if: always() && inputs.race_id == '' && inputs.dry_run != true
        run: |
          python3 src/racing_prediction/inference/precheck.py --venues "$VENUES" --race-numbers "$RACE_NUMBERS" \
            --odds-minutes-before "$NOTIFY_MINUTES_BEFORE"

      - name: Disable for the rest of the day if no races remain
        if: always() && steps.remaining.outputs.remaining == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub の REST API を直接呼ぶ (gh workflow view の --json は gh のバージョンによって使えないため)
          api="repos/${GITHUB_REPOSITORY}/actions/workflows/race-inference.yml"
          if [ "$(gh api "$api" --jq .state)" = "active" ]; then
            gh api -X PUT "$api/disable"
          fi
          echo "今日送る通知が残っていないため race-inference を無効にしました"
