# 発走前に 3 着以内の確率とワイドの確率を予測して通知する.
#
# - 毎日 12:00〜16:50 (日本時間) に 10 分おきに起動し, 発走 50〜10 分前のレースを予測する
#   (馬体重は発走 60 分前に発表される).
#   土日だけでなく, 祝日開催・代替開催 (例: 2026-02-10 火曜) にも対応するため曜日では絞らない.
# - 無料枠の節約のため, 起動が必要な日だけ有効にする:
#     - 毎朝 race-day-planner が時刻表を取得し, 対象レースがある日だけこのワークフローを有効にする
#       (非開催日は無効にするので, 10 分おきの起動自体が行われない)
#     - その日に予測できる対象レースが残っていなくなったら (最終レース後など), このワークフローが自分を無効にする
# - 各起動では, 状態ファイル (時刻表・通知済みレース) だけで「今予測するレースがあるか」を判定し,
#   なければ重いライブラリのインストール前に終了する.
# - 無効になっているときに手動実行 (Run workflow) したい場合は, Actions 画面で先に「Enable workflow」を押す.
# - 予測に使うモデルは models/production/ (model.txt, metadata.json) をリポジトリに置く.
# - 通知先は Secrets に設定する (SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, MAIL_TO, NTFY_TOPIC).
# - 定期実行 (schedule) はデフォルトブランチ (main) にあるこのファイルだけが動く.
name: race-inference

on:
  schedule:
    # UTC で指定 (UTC 3:00〜7:50 = 日本時間 12:00〜16:50). 毎日
    - cron: "*/10 3-7 * * *"
  workflow_dispatch:
    inputs:
      race_id:
        description: "時刻に関係なく予測するレース ID (空なら通常どおり発走が近いレース)"
        required: false
        default: ""
      dry_run:
        description: "通知せずにログに表示するだけ"
        type: boolean
        default: false

# 前の実行が長引いても同時に動かさない (通知の重複を防ぐ)
concurrency:
  group: race-inference
  cancel-in-progress: false

permissions:
  actions: write   # 自分自身の無効化, キャッシュの保存
  contents: read

env:
  # 対象の競馬場・レース番号 (Settings > Secrets and variables > Actions > Variables で変更できる)
  VENUES: ${{ vars.INFERENCE_VENUES }}
  RACE_NUMBERS: ${{ vars.INFERENCE_RACE_NUMBERS || '7-12' }}

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # その日の時刻表と通知済みレースを前回の実行から引き継ぐ
      - name: Restore state
        uses: actions/cache/restore@v6
        with:
          path: .inference_state
          key: inference-state-${{ github.run_id }}
          restore-keys: inference-state-

      # 標準ライブラリだけで判定 (ネットアクセスなし). 手動でレース ID を指定したときは必ず実行する
      - name: Check whether to run
        id: precheck
        env:
          RACE_ID: ${{ inputs.race_id }}
        run: |
          if [ -n "$RACE_ID" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "レース ID が指定されたため実行します: $RACE_ID"
          else
            python3 src/racing_prediction/inference/precheck.py --venues "$VENUES" --race-numbers "$RACE_NUMBERS"
          fi

      - uses: actions/setup-python@v7
        if: steps.precheck.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-inference.txt

      - name: Install dependencies
        if: steps.precheck.outputs.run == 'true'
        run: pip install -r requirements-inference.txt

      - name: Predict and notify
        if: steps.precheck.outputs.run == 'true'
        env:
          PYTHONPATH: src
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RACE_ID: ${{ inputs.race_id }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--venues "$VENUES" --race-numbers "$RACE_NUMBERS")
          if [ -n "$RACE_ID" ]; then args+=(--race-id "$RACE_ID"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          python -m racing_prediction.inference.run "${args[@]}"

      - name: Save state
        if: always() && steps.precheck.outputs.run == 'true' && hashFiles('.inference_state/**') != ''
        uses: actions/cache/save@v6
        with:
          path: .inference_state
          key: inference-state-${{ github.run_id }}

      # 今日これから予測できる対象レースが残っていなければ (非開催日・最終レース後など),
      # このワークフローを無効にして以降の起動を止める. 翌日以降は race-day-planner が必要な日に有効に戻す.
      - name: Check remaining races
        id: remaining
        if: always() && github.event_name == 'schedule'
        run: python3 src/racing_prediction/inference/precheck.py --venues "$VENUES" --race-numbers "$RACE_NUMBERS"

      - name: Disable for the rest of the day if no races remain
        if: always() && github.event_name == 'schedule' && steps.remaining.outputs.remaining == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub の REST API を直接呼ぶ (gh workflow view の --json は gh のバージョンによって使えないため)
          api="repos/${GITHUB_REPOSITORY}/actions/workflows/race-inference.yml"
          if [ "$(gh api "$api" --jq .state)" = "active" ]; then
            gh api -X PUT "$api/disable"
          fi
          echo "今日予測できる対象レースが残っていないため race-inference を無効にしました"
