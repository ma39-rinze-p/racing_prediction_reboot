# 買い方の期待値の設定 (推論・通知で使う. racing_prediction.betting.strategies).
# 単勝・複勝・ワイド・3 連複・3 連単のそれぞれで, 1 点買い・ボックス・ながし・フォーメーションの買い方の
# 期待値と的中率を計算し, 「期待値がプラス」かつ「的中率が min_hit_rate 以上」の買い方だけをメールに載せる.
#
# 期待値 = 使う確率 × オッズ − 1 (複勝・ワイドはオッズに幅があるので, 控えめに最低オッズで計算する)
# 使う確率は, モデルの確率と「オッズから逆算した市場の確率」を組み合わせたもの.
# モデルの確率だけで計算すると, モデルが過大評価している大穴 (オッズ数百倍など) の期待値が
# 異常に大きくなり, 実際にはマイナスの馬券を勧めてしまうため.
# 的中率は, 買い方に含まれる点のどれかが当たる確率 (モデルの着順シミュレーションで数える).

common:
  # メールに載せる買い方の的中率の下限 (0.10 = 10%)
  min_hit_rate: 0.10
  # ボックス・ながし・フォーメーションに使う馬の頭数 (3 着以内の確率が高い順. 3〜10. 多いと計算に時間がかかる)
  # 1 点買いは全ての組み合わせを計算する
  candidates: 7
  # 1 つの買い方の最大点数 (1 点 100 円)
  max_tickets: 30
  # 券種ごとにメールに載せる買い方の最大数 (的中率の高い順)
  max_display: 5

# リスクを分散した組み合わせ.
# 券種ごとのおすすめを上から買うと, 同じ馬 (例: 単勝の馬と 3 連単の 1 着固定の馬) に頼った買い方ばかりになり,
# その馬が来なければ全部外れる (共倒れ). そこで, 期待値プラスの買い方 (券種をまたいで) から,
# 「全部外れる確率」が最も低くなるように, 外れ方の違う (別の馬が来たときに当たる) 買い方を選んで組み合わせる.
# 候補には, 1 着の確率が高い上位 3 頭のそれぞれを含まない買い方 (押さえ) も入れる.
# 期待値プラスの元がモデルの評価する 1 頭だけのレースでは, その馬を含まない買い方は期待値がマイナスになるため,
# 押さえは期待値が少しマイナス (期待回収率 min_bet_return 以上) でもよいことにし, 組み合わせ全体の期待回収率は
# min_total_return 以上を保つ (= 期待値を少し下げる代わりに, 共倒れの確率を下げる).
# (着順のシミュレーションの各結果で, 全ての買い方の払戻を合計して数える)
portfolio:
  enabled: true
  # 組み合わせ全体の購入額の上限 (円)
  max_stake: 3000
  # 組み合わせる買い方の最大数
  max_bets: 3
  # 券種ごとに, 期待値プラスの買い方 (的中率の高い順) の上位何通りを組み合わせの候補にするか
  candidates_per_type: 10
  # 組み合わせの候補にする買い方の的中率の下限 (おすすめの min_hit_rate より緩くして, 人気の馬が来なかったときの
  # 押さえになる買い方も候補に入れる)
  min_hit_rate: 0.02
  # 組み合わせを選ぶ目的 (並べた順にメールに載せる. 1 つだけにしてもよい)
  #   profit   : 収支がプラスになる確率が最も高い組み合わせ (収支プラス重視)
  #   no_miss  : 当たったときは必ず収支がプラスになる (トリガミにならない) 組み合わせの中で, 全部外れる確率が
  #              最も低い組み合わせ (共倒れ回避重視)
  #   half_back: 購入額の半分以上が戻る確率が最も高い組み合わせ (大負け回避重視)
  objectives: [profit, no_miss]
  # 押さえにする買い方の期待回収率の下限 (0.8 = 80%. 1.0 にすると期待値プラスの買い方だけで組み合わせる)
  min_bet_return: 0.8
  # 組み合わせ全体の期待回収率の下限 (1.0 = 100%. 全体では期待値プラスを保つ)
  min_total_return: 1.0

# 券種ごとの設定 (win = 単勝, place = 複勝, wide = ワイド, trio = 3 連複, trifecta = 3 連単)
#   enabled       : false にするとその券種は計算しない (オッズも取得しない)
#   market_weight : 市場の確率をどれだけ重視するか (0 = モデルだけ, 1 = 市場だけ).
#                   モデルがオッズより当たることを過去のレースで確かめるまでは 0.5 以上を推奨
#   max_odds      : オッズがこれより高い点は, モデルを信用せず市場の確率だけで計算する (期待値は控除率の分マイナスになる)
#   min_model_prob: モデルの確率がこれより低い点も, 市場の確率だけで計算する
bet_types:
  win:
    enabled: true
    market_weight: 0.5
    max_odds: 30
    min_model_prob: 0.03
  place:
    enabled: true
    market_weight: 0.5
    max_odds: 10
    min_model_prob: 0.10
  wide:
    enabled: true
    market_weight: 0.5
    max_odds: 50
    min_model_prob: 0.05
  trio:
    enabled: true
    market_weight: 0.5
    max_odds: 300
    min_model_prob: 0.003
  trifecta:
    enabled: true
    market_weight: 0.5
    max_odds: 2000
    min_model_prob: 0.0005
