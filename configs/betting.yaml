# ワイドの期待値の設定 (推論・通知で使う). 期待値がプラスの組み合わせを全て通知する.
#
# 期待値 = 使う確率 × 最低オッズ − 1
# 使う確率は, モデルの確率と「オッズから逆算した市場の確率」を組み合わせたもの.
# モデルの確率だけで計算すると, モデルが過大評価している大穴の組み合わせ (オッズ数百倍など) の期待値が
# 異常に大きくなり, 実際にはマイナスの馬券を勧めてしまうため.

wide:
  # 市場の確率をどれだけ重視するか (0 = モデルだけ, 1 = 市場だけ).
  # モデルの精度が人気順 (オッズ) を上回るまでは, 0.5 以上を推奨
  market_weight: 0
  # 最低オッズがこれより高い組み合わせは, モデルを信用せず市場の確率だけで計算する (期待値は控除率の分マイナスになる)
  max_odds: 1000
  # モデルのワイド的中確率がこれより低い組み合わせも, 市場の確率だけで計算する
  min_model_prob: 0.00001
