# 学習 (notebooks/predict_jra_racing.ipynb) の設定.
# Kaggle で学習する場合, この内容はデータセットと一緒にアップロードされる.
# 変更したら `python scripts/train_on_kaggle.py --update-dataset` で反映すること.

data:
  # 学習・テストに使うデータの期間 (開催日, 両端を含む). null なら制限なし
  start_date: null
  end_date: "2026-11-28"
  # 学習・テストに使う競馬場 (例: [東京, 京都, 中山]). null なら data/processed/races にある全競馬場を使う
  # 札幌・函館・福島・新潟・東京・中山・中京・京都・阪神・小倉 から選ぶ
  venues: null

model:
  # true: オッズとの差だけを学習する. 単勝オッズから逆算した確率を出発点にして, モデルは「オッズがどれだけ外れているか」
  #       だけを学ぶ (オッズは特徴量に入れない). 推論 (GitHub Actions) では発走前の単勝オッズを取得して使う
  # false: オッズを使わずに予測する (以前の方式)
  market_offset: true

top3:
  # true: 1 着のモデルに加えて, 3 着以内に入る確率のモデルも学習する (複勝・ワイド・3 連複・3 連単の予測に使う).
  #       特徴量・オッズの扱い (model.market_offset)・時系列 CV は 1 着のモデルと同じで, ハイパーパラメータは別に探す
  enabled: true
  # 3 着以内のモデルの Optuna の試行回数 / 打ち切り時間 (秒). null なら tuning と同じ
  # (学習時間は 1 着のモデルの分とあわせて約 2 倍になる)
  n_trials: null
  timeout_sec: null

split:
  # 全開催日数のうち, 直近の何割の開催日をテストにするか (0 より大きく 1 より小さい)
  # カレンダーの期間ではなく開催日の数で分けるので, 開催がない月があってもテストの量が安定する
  test_ratio: 0.2

tuning:
  # Optuna の試行回数
  n_trials: 150
  # Optuna の打ち切り時間 (秒). null なら試行回数だけで止める
  timeout_sec: 14400  
  # 学習期間内の時系列 CV の fold 数 (データが少ないとエラーになるので, その場合は小さくする)
  n_folds: 3
